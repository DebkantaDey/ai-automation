version: '3.8'

services:
  # MongoDB Atlas / Community Database
  mongodb:
    image: mongo:7.0
    container_name: auto_saas_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: ai_automation_saas
    volumes:
      - mongodb_data:/data/db
    networks:
      - auto_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ Queues and Caching
  redis:
    image: redis:7.2-alpine
    container_name: auto_saas_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - auto_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend REST API Server (NestJS)
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: auto_saas_backend_api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/ai_automation_saas
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=change-me-in-production-jwt-secret-key-32chars
      - JWT_REFRESH_SECRET=change-me-in-production-jwt-refresh-secret-32chars
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000
      - AI_DEFAULT_PROVIDER=openai
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auto_network

  # Dedicated Background Worker (BullMQ + AI Processors)
  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: auto_saas_backend_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ai_automation_saas
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_DEFAULT_PROVIDER=openai
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auto_network

  # Frontend Web App (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auto_saas_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend-api
    networks:
      - auto_network

networks:
  auto_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
